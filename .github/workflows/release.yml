name: Release archive
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  archive:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Archive tracked source only
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git archive --format=tar.gz --prefix=dokosmotr/ -o "dokosmotr-${RELEASE_TAG}.tar.gz" HEAD
          sha256sum "dokosmotr-${RELEASE_TAG}.tar.gz" > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" "dokosmotr-${RELEASE_TAG}.tar.gz" SHA256SUMS --title "Докосмотр ${RELEASE_TAG}" --generate-notes
