services:
  docker-dashboard:
    build: .
    image: dokosmotr:local
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-5080}:5000"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:5080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      READ_ONLY: ${READ_ONLY:-true}
      UPDATE_INTERVAL: ${UPDATE_INTERVAL:-5}
      SESSION_TTL: ${SESSION_TTL:-28800}
      SERVER_LABEL: ${SERVER_LABEL:-Docker server}
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - dashboard-data:/app/data
    group_add:
      - "${DOCKER_GID:-0}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  dashboard-data:
